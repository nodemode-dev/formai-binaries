name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: tests
      GIT_AUTHOR_EMAIL: tests@example.invalid
      GIT_COMMITTER_NAME: tests
      GIT_COMMITTER_EMAIL: tests@example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tests' requirement
        run: pip install -r tests/requirements.txt
      - name: Tests of the release tools, the build scripts and the records
        run: python -m pytest
